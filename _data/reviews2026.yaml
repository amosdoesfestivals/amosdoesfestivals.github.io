- rank: 90
  name: "Three by Samuel Beckett \u2013 Not I, Eh Joe, Rockaby"
  star: SS
  rating: Poor
  producer: Blackbox Productions & McSquared Productions
  location: Ivy Greenside George Street
  review: Samuel Beckett's obsession with words, sounds, thoughts and bodily function
    is brought to the stage in three short snippets, none of which I had previously
    seen. Criticising a Beckett work is a quick way to render one the title of Philistine,
    but personally, I think we need to get over it. People discuss the meaning and
    character of the script content of "Not I", but what is the point? Beckett's instruction
    is for it to be so fast that, in performance, it is fairly unintelligible. Yes,
    the focus is on the mouth. But there is only so much an audience can get about
    a mouth. It moves. Yes one can get a sense of angst, but that is hardly challenging
    theatre. "Not I" just simply leaves me bored. Eh Joe, on the other hand, is unpleasant
    rather than boring. The derisive thoughts of Joe or accusations of others brought
    to script on a screen. It gives a sense of the way an individual can be belittled
    by both others and their own self, not necessarily without reason, but horrifyingly
    without relent. However, being entirely on screen, the theatre setting adds little
    to this snippet. Rockaby captured me more - the sense of a lone woman sitting
    in the rocking chair looking out of the window, lonely and trapped, grasping at
    any hint of other life from the windows opposite, and eventually closing the blinds,
    summoning the full effort of a trip down down down to her mother's rocking chair
    for her eventual demise. The voice speeds and slows, rocking increases and decreases,
    and the volume changes to signify variations in strength. I can appreciate this
    monologue. Altogether, in a postmodern world, I personally think Beckett's offerings
    do look a little ridiculous. I can appreciate bits and pieces, but it feels too
    self-indulgent to me to be worth elevating against other Fringe offerings. Yes
    I know that existential absurdity and reduction is the point. But for the same
    reason, you cannot expect me to take it as seriously as it wants to demand me
    to.
  start: '19:50'
  end: '20:40'
  url: https://www.edfringe.com/tickets/whats-on/three-by-samuel-beckett-not-i-eh-joe-rockaby
