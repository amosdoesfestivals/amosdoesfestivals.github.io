- rank: 200
  name: Bull / Fight
  star: SSS
  rating: Okay
  producer: Mythography Collective with Macrobert Arts Centre
  location: Former Womens Locker Room at Summerhall
  review: Reflecting on Lorca's poem "Lament for the Death of a Bullfighter" and portraying
    the upheavals in the time he lived in, this play is a montage of scenes around
    the impact of the Franco regime on the people, the poetry and the arts. The plays
    starts with the poets incarceration, jumping back in time to the challenge of
    performing under significant restriction moving in to the life changing impact
    that resulted. Thematically interesting, and intriguing dynamics and showmanship,
    the play loses itself by fusing too many scenes and timejumps together all at
    once without any delineation, leaving the audience a little bewildered. The long
    show of despair in the middle drags on, and in the end the lack of characterisation
    leaves the audience with very little emotional link with what unfolded.
  start: '11:30'
  end: '12:20'
  url: https://www.edfringe.com/tickets/whats-on/bull-fight
- rank: 220
  name: Krapp's Last Tape
  star: SSS
  rating: Okay
  producer: Stockard Channing and David Westhead
  location: Assemby Roxy Upstairs
  review: "Krapp\u2019s Last Tape is a monodrama of Samuel Becket that certainly splits\
    \ opinions. The play can convey some sense of the action of age and time to cleave\
    \ both a man and his memories. But at what age is the essence of an individual\
    \ captured? And does that mean anything when different selves dissonate with one\
    \ another? However to get to that point in this play, the audience has to make\
    \ it through, or even gel with, the self-indulgent tedium of the early play, and\
    \ the mechanical repetitive nature of the play as a whole. Achieving this is a\
    \ challenge (some might say an impossible one), but doing so involves providing\
    \ complete clarity of the tape content, and the real contrasts with the current\
    \ character of Krapp over different repeated listens. I preferred Pinter\u2019\
    s take: axing the grating banana scene from the beginning and giving time to the\
    \ tapes to aid the clear reflection on that. Here unfortunately, the earlier parts\
    \ drag so much that by the time the self-recording comes, the audience requires\
    \ such high redemption from the earlier monotony that the play will not deliver.In\
    \ this production, the characters of Krapp of different ages felt incidental as\
    \ acted even though they were clearly fundamental in the play. But this was very\
    \ capable directing, and very capable acting, so it begs the question once again.\
    \ Does the fault actually just lie with Becket in the first place? Some fault,\
    \ ironically, lies in time itself \u2013 the idea of using tapes in the play was\
    \ a wonder in 1958 that transfers badly to 2026. Perhaps even the early pauses\
    \ and absurdist banana scenes were more powerfully contrasting in 1958? Perhaps\
    \ the blame lies in the instruction of Beckett estate that plays adhere to Becket\u2019\
    s obsessive instruction even 65 years on? Or perhaps, it is the faulty opinion\
    \ of a reviewer living in an age that has lost patience? Would the reviewer have\
    \ thought the same 30 years ago? I wonder \u2013 perhaps I should dig out box\
    \ three, spool five. Spoool."
  start: '13:25'
  end: '14:15'
  url: https://www.edfringe.com/tickets/whats-on/krapp-s-last-tape
