- rank: 220
  name: Krapp's Last Tape
  star: SSH
  rating: Okay
  producer: Stockard Channing and David Westhead
  location: Assembly Roxy Upstairs
  review: "Krapp's Last Tape is a monodrama of Samuel Beckett that certainly splits\
    \ opinions. The play can convey some sense of the action of age and time in cleaving\
    \ both a man and his memories and how different selves are dissonant with one\
    \ another. However, to get to that point, the audience has to make it through,\
    \ or even gel with, the somewhat tedious absurdity of the early play, and the\
    \ mechanical repetitive nature of the play as a whole. Achieving this is a challenge\
    \ (some might say an impossible one), but doing so involves providing complete\
    \ clarity of the tape content, and the real contrasts with the current character\
    \ of Krapp over different repeated listens. I preferred Pinter's take: axing the\
    \ grating banana scene from the beginning and giving time to the tapes to aid\
    \ the clear reflection on that. Here unfortunately, the earlier parts drag so\
    \ much that by the time the self-recording comes, the audience requires such high\
    \ redemption from the earlier monotony that the play will not deliver. In this\
    \ production, some sense of contrast of older and younger Krapp is lost. But this\
    \ was very capable directing, and very capable acting, so some of the difficulties\
    \ lie in the play itself and ironically in the passage of time \u2013 the idea\
    \ of using tapes in the play was a wonder in 1958 that transfers badly to 2026.\
    \ The Beckett estate requires strict adherence to Beckett's original obsessive\
    \ instruction. Or maybe it is the faulty opinion of a reviewer living in an age\
    \ that has lost patience... Would I have thought the same 30 years ago? I wonder\
    \ \u2013 perhaps I should dig out box three, spool five. Spoool."
  start: '13:25'
  end: '14:15'
  url: https://www.edfringe.com/tickets/whats-on/krapp-s-last-tape
