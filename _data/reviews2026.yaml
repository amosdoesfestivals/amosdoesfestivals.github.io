- rank: 520
  name: Waving
  star: SSSS
  rating: Very good
  producer: Dogs in Wellies
  location: Stephenson Theatre at theSpace @ Surgeons' Hall
  review: 'A play nominally about a mother suffering from dementia but actually as
    much about memories, past perceptions and how time plays out. Played backward
    in time, mirroring the memory regression of the disease, we see three characters
    converge backwards in time, leaving the lingering feeling of what might have been.
    A mostly solid and well written performance - the gallery scene is a little stilted
    but otherwise it held up. Lacking the layers and more climactic elements of great
    shows, it still quietly conveys its simple message, tinged not so much with regret
    as a simple recognition that time does its own work, whatever we do. '
  start: '19:45'
  end: '20:35'
  url: https://www.edfringe.com/tickets/whats-on/waving
- rank: 480
  name: 'Gail Porter: Portergeist'
  star: SSSS
  rating: Good
  producer: Gail Porter
  location: Drawing Room at Assembly Rooms
  review: A refreshing set of tales for the those born vaguely around 1970s UK. Others
    might miss a lot. Scots will get more still. Both comic and reflective of the
    50 years of life in a era of "If it didn't Kill you...". When the best show in
    town was Asda moving to opening 24/7. Funny but not just funny. Cathartic for
    those who don't necessarily want to go back, but are also aware of what has been
    lost over that half century.
