  name: Bull / Fight
  star: SSS
  rating: Okay
  producer: Mythography Collective with Macrobert Arts Centre
  location: Former Womens Locker Room at Summerhall
  review: Reflecting on Lorca's poem "Lament for the Death of a Bullfighter" and portraying
    the upheavals in the time he lived in, this play is a montage of scenes around
    the impact of the Franco regime on the people, the poetry and the arts. The plays
    starts with the poets incarceration, jumping back in time to the challenge of
    performing under significant restriction moving in to the life changing impact
    that resulted. Thematically interesting, and intriguing dynamics and showmanship,
    the play loses itself by fusing too many scenes and timejumps together all at
    once without any delineation, leaving the audience a little bewildered. The long
    show of despair in the middle drags on, and in the end the lack of characterisation
    leaves the audience with very little emotional link with what unfolded.
